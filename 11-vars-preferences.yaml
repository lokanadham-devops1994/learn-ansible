- name: demo on variable from external file
  hosts: local
  connection: local
  gather_facts: false 
  vars:
    course: "Ansible for PLAY"
  vars_prompt:
    - name: "course"
      prompt: "Please enter the course name"
      private: no
  vars_files:
  - course.yaml
  tasks:
    - name: print Course information
      # vars:
      #   course: "Ansible for task"
      ansible.builtin.debug:
        msg: "I am learning {{ course }}"

# 1.CMD
# 2. Task
# 3. external file
# 4. Prompt