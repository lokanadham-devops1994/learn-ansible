- name: demo on variables from prompt
  hosts: local
  connection: local
  gather_facts: false 
  vars_prompt:
    - name: "username"
      prompt: "Enter your username"
      private: no
    - name: "password"
      prompt: "Enter your password"
      private: yes
  tasks:
    - name: print the confidential information
      ansible.builtin.debug:
        msg: "Username: {{ username }}, Password: {{ password }}"