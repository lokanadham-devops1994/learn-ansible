- name: demo on task level variable
  hosts: local
  connection: local
  gather_facts: false 
  vars:
    Property: "100 Acres"
  tasks:
    - name: Print task level variable
      ansible.builtin.debug:
        msg: "I got {{ Property }} from my father"

    - name: Print task level variable again
      vars:
        Property: "20 Acres"
      ansible.builtin.debug:
        msg: "I got {{ Property }} from my father"